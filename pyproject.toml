[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wfp"
version = "0.1.0"
description = "WFP - Workflow Pipeline Platform（通用流水线平台）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jsonschema>=4.20",
  "ruamel.yaml>=0.18",
  "PyYAML>=6.0",
  "cryptography>=42",
  "keyring>=25",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.10", "hypothesis>=6.100"]
remote = ["paramiko>=3.4"]          # DR-54 (M2)
winrm = ["pypsrp>=0.8"]             # DR-84 (M5, 可选)

[project.scripts]
wfp = "wfp.cli:main"                # DR-04 全局入口

[tool.hatch.build.targets.wheel]
packages = ["wfp"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "wfp/_schemas"          # 契约随包分发（DR-07/73 离线）
"config.example.toml" = "wfp/config.example.toml"  # 启动配置模板随包分发

[tool.hatch.build.targets.wheel.shared-data]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["remote: 需要真实远程靶机（默认跳过）"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E702：CLI 子命令声明采用紧凑写法（一行 add_parser + add_argument），属项目约定风格
ignore = ["E501", "E702"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
